name: CI

on:
  push:
    branches: [develop] # beta invokes automatically on every push. Manual dispatch covers both beta and release.
  workflow_dispatch:
    inputs:
      release-mode:
        description: Channel for this manual run -- 'beta' or 'release'. Defaults to 'beta' if left unset.
        type: choice
        options:
          - beta
          - release
        default: beta

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

jobs:
  # NuGet.org Trusted Publishing (OIDC) can't run inside reusable-ci.yml itself: a
  # reusable workflow's OIDC token always names ITS OWN hosting repo/file in the
  # job_workflow_ref claim, never the caller's, no matter how the nuget.org trust
  # policy is configured (see reusable-ci.yml's nuget-auth-mode input for the full
  # explanation, and github.com/NuGet/login issues #6 and #24). So reusable-ci.yml is
  # called here with publish-to-nuget: false -- it still bumps the version, writes the
  # changelog, tags, creates the GitHub Release, builds/tests/packs, and uploads
  # pkg-*/symbols-* artifacts; it just skips its own internal NuGet publish step.
  # publish-nuget-oidc below does the actual push, as steps running directly in THIS
  # file via the KiarashMinoo/.github/.github/actions/nuget-oidc-publish composite
  # action -- because that action's steps execute inline in this job (not inside a
  # called reusable workflow), the OIDC token's job_workflow_ref names this repo +
  # this file, matching a Trusted Publishing policy configured with Repository
  # Owner=KiarashMinoo, Repository=ThunderPropagator.ClusterMessageBuses, Workflow
  # File=ci.yml. Requires a NUGET_USER repo secret (the nuget.org username the policy
  # is attached to) -- Settings > Secrets and variables > Actions > Secrets.
  #
  # ADMIN_PUSH_TOKEN: develop has a classic "Require a pull request before merging"
  # branch protection rule with no usable bypass for the default GITHUB_TOKEN identity
  # (github-actions[bot]) -- neither classic protection's "administrators can bypass"
  # toggle nor this (personal, non-org) repo's Ruleset bypass list can be granted to
  # that identity, only to a real admin-role account. So a Personal Access Token
  # belonging to an account with Admin role on this repo is stored as the ADMIN_PUSH_TOKEN
  # secret and passed through as push-token, which reusable-ci.yml's version job uses
  # (instead of gh-token) ONLY for the checkout that sets up the git credential the
  # later version-bump commit push reuses. That admin account's role must also be added
  # to the branch protection/ruleset's bypass list on GitHub's side for this to work.
  #
  # IMPORTANT: a job-level `permissions:` block is exhaustive, not additive -- any
  # scope not listed here is implicitly set to "none" for every nested job the called
  # reusable workflow runs, regardless of what that nested job requests for itself --
  # and GitHub validates this statically against every job reusable-ci.yml DECLARES,
  # not just the ones that will actually execute once `if:` conditions are evaluated.
  # So even with publish-to-nuget: false (which only skips publish-nuget/
  # cleanup-nuget-artifacts at runtime), this must still list every scope those two
  # jobs declare needing: contents:write (version/changelog commit, tag, GitHub
  # Release), packages:write + id-token:write (publish-nuget's GitHub Packages / OIDC
  # paths), actions:write (cleanup-nuget-artifacts, to delete run artifacts) -- or the
  # run fails at startup with "requesting X, but is only allowed none".
  #
  # beta-ci and manual-ci are gated by BOTH github.event_name and github.ref (not ref
  # alone) so a manual workflow_dispatch run from develop can't accidentally trigger
  # both jobs at once: beta-ci only ever fires on an automatic push to develop.
  # manual-ci only ever fires on a manual dispatch (from develop -- this repo doesn't
  # cut separate release/** branches -- or a release/** branch if it ever does), and
  # uses whatever channel the release-mode input was set to, defaulting to 'beta' if
  # the dispatcher left it unset -- so an unconfigured manual run is still just a beta,
  # not an accidental release.
  beta-ci:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: write
    uses: KiarashMinoo/.github/.github/workflows/reusable-ci.yml@main
    with:
      channel: beta
      solution-path: 'ThunderPropagator.ClusterMessageBuses.slnx'
      publish-to-nuget: false
      nuget-filter-enabled: true
    secrets:
      gh-token: ${{ secrets.GITHUB_TOKEN }}
      push-token: ${{ secrets.ADMIN_PUSH_TOKEN }}

  manual-ci:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: write
    uses: KiarashMinoo/.github/.github/workflows/reusable-ci.yml@main
    with:
      channel: ${{ inputs.release-mode }}
      solution-path: 'ThunderPropagator.ClusterMessageBuses.slnx'
      publish-to-nuget: false
      nuget-filter-enabled: true
    secrets:
      gh-token: ${{ secrets.GITHUB_TOKEN }}
      push-token: ${{ secrets.ADMIN_PUSH_TOKEN }}

  publish-nuget-oidc:
    name: Publish packages (OIDC Trusted Publishing)
    needs: [beta-ci, manual-ci]
    if: always() && (needs.beta-ci.result == 'success' || needs.manual-ci.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: KiarashMinoo/.github/.github/actions/nuget-oidc-publish@main
        with:
          nuget-user: ${{ secrets.NUGET_USER }}
          nuget-filter-enabled: false
