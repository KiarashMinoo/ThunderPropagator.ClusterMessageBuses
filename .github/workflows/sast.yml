name: SAST — Static Analysis Security Testing

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'   # 12:00 AM UTC daily
    - cron: '0 12 * * *'  # 12:00 PM UTC daily
  workflow_dispatch:
    inputs:
      enable-codeql:
        description: Run CodeQL analysis
        type: boolean
        default: true
      enable-devskim:
        description: Run DevSkim SAST analysis
        type: boolean
        default: true
      enable-secret-scan:
        description: Run TruffleHog secret scanning
        type: boolean
        default: true
      fail-on-findings:
        description: Fail if any security findings are detected
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast:
    uses: KiarashMinoo/.github/.github/workflows/reusable-sast.yml@main
    with:
      languages: '["csharp"]'
      dotnet-versions: |
        8.0.x
        9.0.x
        10.0.x
      solution-path: 'ThunderPropagator.ClusterMessageBuses.slnx'
      enable-codeql: ${{ github.event_name == 'workflow_dispatch' && inputs.enable-codeql || true }}
      enable-devskim: ${{ github.event_name == 'workflow_dispatch' && inputs.enable-devskim || true }}
      enable-secret-scan: ${{ github.event_name == 'workflow_dispatch' && inputs.enable-secret-scan || true }}
      codeql-queries: 'security-extended,security-and-quality'
      fail-on-findings: ${{ github.event_name == 'workflow_dispatch' && inputs.fail-on-findings || false }}
    secrets:
      gh-token: ${{ secrets.GITHUB_TOKEN }}
